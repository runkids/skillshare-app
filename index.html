<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/image.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skillshare App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      // Initialize theme before page renders to prevent flash
      // MUST match ThemeContext.tsx storage keys and logic
      (function() {
        const THEME_MODE_KEY = 'skillshare-theme-preference';
        const LEGACY_THEME_KEY = 'skillshare-theme';

        // Background colors matching index.css CSS variables.
        // IMPORTANT: These values MUST be kept in sync with --color-paper in :root and .dark in index.css.
        const DARK_BG = '#111110';  // --color-paper in .dark
        const LIGHT_BG = '#f7f6f3'; // --color-paper in :root

        // Determine theme mode (matches ThemeContext logic)
        let mode;
        try {
          mode = localStorage.getItem(THEME_MODE_KEY);
        } catch (e) {
          mode = 'system';
        }

        if (!mode || !['light', 'dark', 'system'].includes(mode)) {
          // Check legacy key for backward compatibility
          let legacy;
          try {
            legacy = localStorage.getItem(LEGACY_THEME_KEY);
          } catch (e) {
            // localStorage inaccessible, legacy remains undefined
          }

          if (legacy && ['light', 'dark'].includes(legacy)) {
            mode = legacy;
          } else {
            mode = 'system';
          }
        }

        // Resolve to actual theme
        const isDark = (mode === 'system')
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : (mode === 'dark');

        // Apply theme class
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }

        // Set background color immediately to prevent white flash
        document.documentElement.style.backgroundColor = isDark ? DARK_BG : LIGHT_BG;

        // Playful backgrounds, as --bg in theme-tokens.css.
        const PLAYFUL_BG = isDark ? '#1c1b19' : '#f8f5ef';
        let style;
        try {
          style = localStorage.getItem('skillshare-style');
        } catch (e) {
          style = null;
        }
        if (style === 'playful') {
          document.documentElement.setAttribute('data-theme', 'playful');
          document.documentElement.style.backgroundColor = PLAYFUL_BG;
        }
        // A custom theme: its base style and the colours the CLI UI reported for this mode.
        // ThemeContext checks the saved theme again and falls back to Clean without one.
        if (style === 'custom') {
          try {
            const saved = JSON.parse(localStorage.getItem('skillshare-custom-theme'));
            const vars = saved.vars[isDark ? 'dark' : 'light'];
            if (saved.custom.base === 'playful') {
              document.documentElement.setAttribute('data-theme', 'playful');
            }
            if (typeof vars.bg === 'string') document.documentElement.style.backgroundColor = vars.bg;
          } catch (e) {
            // No usable theme: the Clean background above stays.
          }
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
