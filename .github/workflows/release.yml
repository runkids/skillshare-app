name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing tag to build or retry (e.g., v0.0.6)'
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

concurrency:
  group: release-build-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Verify release versions
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          node --test scripts/tests/check-release-version.mjs
          node scripts/check-release-version.mjs "$RELEASE_TAG"

      - name: Prepare release draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          if ! gh release view "$RELEASE_TAG" --json databaseId,isDraft > release.json; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Skillshare App $RELEASE_TAG" --generate-notes
            gh release view "$RELEASE_TAG" --json databaseId,isDraft > release.json
          fi
          if [ "$(jq -r '.isDraft' release.json)" != "true" ]; then
            echo "::error::This release is already published; only drafts can be rebuilt."
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --title "Skillshare App $RELEASE_TAG"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$(jq -r '.databaseId' release.json)" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      matrix:
        target: [aarch64-apple-darwin]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.11

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true
          key: ${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Run frontend regression tests
        run: pnpm test

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: --target ${{ matrix.target }}

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend regression tests
        run: pnpm test

      # tauri-bundler downloads its packaging tools anonymously from GitHub Releases,
      # which can time out (v0.8.0 failed twice on `http status: 504`). Cache them, and
      # fill a cache miss with the token; the bundler skips tools that are already there.
      # Names and hashes match @tauri-apps/cli 2.12.0 (crates/tauri-bundler); after a
      # CLI bump, update them from that version's source.
      - name: Read Tauri CLI version
        id: tauri-cli
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-tools-${{ runner.os }}-${{ steps.tauri-cli.outputs.version }}

      - name: Prefetch Tauri bundler tools
        if: steps.tauri-cli.outputs.version == '2.12.0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir="$(cygpath -u "$LOCALAPPDATA")/tauri"
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          nsis="$dir/NSIS"
          utils="$nsis/Plugins/x86-unicode/additional"
          mkdir -p "$dir"
          if [ ! -e "$utils/nsis_tauri_utils.dll" ]; then
            rm -rf "$nsis" "$dir/nsis-3.11"
            gh release download nsis-3.11 -R tauri-apps/binary-releases -p nsis-3.11.zip -D "$tmp"
            echo "ef7ff767e5cbd9edd22add3a32c9b8f4500bb10d  $tmp/nsis-3.11.zip" | sha1sum -c
            unzip -q "$tmp/nsis-3.11.zip" -d "$dir"
            mv "$dir/nsis-3.11" "$nsis"
            mkdir -p "$utils"
            gh release download nsis_tauri_utils-v0.5.3 -R tauri-apps/nsis-tauri-utils -p nsis_tauri_utils.dll -D "$utils"
            echo "75197fee3c6a814fe035788d1c34ead39349b860  $utils/nsis_tauri_utils.dll" | sha1sum -c
          fi
          if [ ! -e "$dir/WixTools314/light.exe" ]; then
            gh release download wix3141rtm -R wixtoolset/wix3 -p wix314-binaries.zip -D "$tmp"
            echo "6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31  $tmp/wix314-binaries.zip" | sha256sum -c
            unzip -q "$tmp/wix314-binaries.zip" -d "$dir/WixTools314"
          fi

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}

  build-linux:
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag_name }}

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.11

      - name: Install Linux dependencies
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=20 install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-all-crates: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend regression tests
        run: pnpm test

      # tauri-bundler downloads its packaging tools anonymously from GitHub Releases,
      # which can time out (v0.8.0 failed twice on `http status: 504`). Cache them, and
      # fill a cache miss with the token; the bundler skips tools that are already there.
      # Names and hashes match @tauri-apps/cli 2.12.0 (crates/tauri-bundler); after a
      # CLI bump, update them from that version's source.
      - name: Read Tauri CLI version
        id: tauri-cli
        shell: bash
        run: echo "version=$(node -p "require('./node_modules/@tauri-apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Tauri bundler tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/tauri
          key: tauri-tools-${{ runner.os }}-${{ steps.tauri-cli.outputs.version }}

      - name: Prefetch Tauri bundler tools
        if: steps.tauri-cli.outputs.version == '2.12.0'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dir=~/.cache/tauri
          mkdir -p "$dir"
          get() {
            [ -e "$dir/$4" ] && return
            gh release download "$2" -R "$1" -p "$3" -O "$dir/$4" && chmod +x "$dir/$4"
          }
          get tauri-apps/binary-releases apprun-old AppRun-x86_64 AppRun-x86_64
          get tauri-apps/binary-releases linuxdeploy-07333c6 linuxdeploy-x86_64.AppImage linuxdeploy-07333c6-x86_64.AppImage
          # Optional, as in the bundler: linuxdeploy falls back to its built-in plugin.
          get linuxdeploy/linuxdeploy-plugin-appimage continuous linuxdeploy-plugin-appimage-x86_64.AppImage linuxdeploy-plugin-appimage.AppImage || true

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}

  release-ready:
    needs: [prepare-release, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      # Only reached when every platform built, so a failed build stays a draft.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag_name }}
        run: |
          gh release edit "$RELEASE_TAG" --draft=false --latest
          RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
          echo "All three platform builds succeeded and [the release]($RELEASE_URL) is published." >> "$GITHUB_STEP_SUMMARY"

  update-homebrew:
    needs: [prepare-release, release-ready]
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ needs.prepare-release.outputs.tag_name }}
    secrets: inherit
