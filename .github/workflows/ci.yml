name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check agent docs
        run: python3 scripts/ai-context.py check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mise-managed tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.9.11

      # mise installs Rust with the minimal profile, which omits these.
      - name: Install Rust components
        run: rustup component add rustfmt clippy

      # The runner's apt mirror often stalls on single packages; keep the
      # downloaded .debs so most runs need the network only for the index.
      - name: Restore apt packages
        id: apt-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-webkit2gtk-4.1-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: apt-${{ runner.os }}-webkit2gtk-4.1-v1-

      - name: Install Linux dependencies
        id: apt-install
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          mkdir -p ~/apt-cache/partial
          apt_opts=(-o Dir::Cache::Archives="$HOME/apt-cache" -o Acquire::Retries=5 -o Acquire::http::Timeout=20)
          sudo apt-get "${apt_opts[@]}" update
          sudo apt-get "${apt_opts[@]}" install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # Save on a miss, and even after a timeout, so the packages fetched so far
      # are kept for the rerun. A run that restored and installed adds nothing.
      - name: Prepare apt packages for saving
        id: apt-prepare
        if: always() && (steps.apt-restore.outputs.cache-matched-key == '' || steps.apt-install.outcome != 'success')
        run: sudo chown -R "$USER" ~/apt-cache && rm -rf ~/apt-cache/partial ~/apt-cache/lock

      - name: Save apt packages
        if: always() && steps.apt-prepare.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-cache
          key: apt-${{ runner.os }}-webkit2gtk-4.1-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! requires frontendDist to exist at compile time.
      - name: Create placeholder frontend dist
        run: mkdir -p ../dist

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test
